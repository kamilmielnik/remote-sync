indexes: []
name: dim_film
description: "One row per: film. Key: film_id. Sources: public.film, public.language, public.rental, public.inventory. Definition: each film with its title, MPAA rating, language and all-time rental count; rentals_rank_all_time orders films by all-time rentals, most first, ties broken by title then film_id, so ranks are 1..N with no ties. Caveats: films never rented (no copies) have rentals_all_time 0 and rank last; the rank is all-time and does not follow dashboard date filters."
entity_id: qQD8MD8G9NmOxWf6GYaSa
creator_id: internal@metabase.com
collection_id: ipmGMgipslAkePDb6JyAP
source_database_id: pagila
source:
  type: query
  query:
    lib/type: mbql/query
    database: pagila
    stages:
    - lib/type: mbql.stage/native
      native: |-
        -- One row per: film
        -- Key:         film_id
        -- Sources:     public.film, public.language, public.rental, public.inventory
        -- Definition:  film labels, all-time rentals and the all-time rental rank (rentals desc, title, film_id)
        -- Caveats:     never-rented films have 0 rentals and rank last; rank ignores dashboard filters
        WITH film_rentals AS (
          SELECT
            inv.film_id,
            COUNT(*) AS rentals
          FROM public.rental AS r
          JOIN public.inventory AS inv
            ON inv.inventory_id = r.inventory_id
          GROUP BY inv.film_id
        )
        SELECT
          f.film_id,
          f.title,
          f.release_year,
          CAST(f.rating AS TEXT) AS rating,
          l.name AS language_name,
          f.rental_rate,
          f.length AS length_minutes,
          f.replacement_cost,
          COALESCE(fr.rentals, 0) AS rentals_all_time,
          ROW_NUMBER() OVER (
            ORDER BY COALESCE(fr.rentals, 0) DESC, f.title ASC, f.film_id ASC
          ) AS rentals_rank_all_time
        FROM public.film AS f
        LEFT JOIN public.language AS l
          ON l.language_id = f.language_id
        LEFT JOIN film_rentals AS fr
          ON fr.film_id = f.film_id
      template-tags: {}
tags: []
target:
